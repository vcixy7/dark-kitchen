<div class="registration-container">
  
  <header class="registration-header">
    <button class="btn-back" (click)="currentStep === 1 ? voltarParaTelaAnterior() : previousStep()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="header-texts">
      <h1>Cadastro de Restaurante</h1>
      <p>Cadastre seu estabelecimento no Flash Food</p>
    </div>
  </header>

  <div class="stepper-wrapper">
    <div class="step-item" [ngClass]="{'active': currentStep >= 1}">
      <div class="step-circle">1</div>
    </div>
    <div class="step-line" [ngClass]="{'filled': currentStep >= 2}"></div>
    <div class="step-item" [ngClass]="{'active': currentStep >= 2}">
      <div class="step-circle">2</div>
    </div>
    <div class="step-line" [ngClass]="{'filled': currentStep >= 3}"></div>
    <div class="step-item" [ngClass]="{'active': currentStep >= 3}">
      <div class="step-circle">3</div>
    </div>
  </div>

  <div class="form-card">

    <div *ngIf="currentStep === 1" class="step-content">
      <div class="step-title">
        <svg class="icon-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <h2>Dados do Responsável</h2>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Nome *</label>
          <input type="text" placeholder="Digite seu nome">
        </div>
        <div class="form-group">
          <label>Sobrenome *</label>
          <input type="text" placeholder="Digite seu sobrenome">
        </div>
      </div>

      <div class="form-group">
        <label>CPF do Responsável *</label>
        <input type="text" placeholder="000.000.000-00">
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Email *</label>
          <input type="email" placeholder="seu-email@provedor.com">
        </div>
        <div class="form-group">
          <label>Telefone *</label>
          <input type="text" placeholder="(00) 00000-0000">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Senha *</label>
          <input type="password" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label>Confirmar Senha *</label>
          <input type="password" placeholder="••••••••">
        </div>
      </div>

      <button class="btn-primary" (click)="nextStep()">Próximo</button>
    </div>

    <div *ngIf="currentStep === 2" class="step-content">
      <div class="step-title">
        <svg class="icon-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
        <h2>Dados do Restaurante</h2>
      </div>

      <div class="form-group">
        <label>Nome do Restaurante *</label>
        <input type="text" placeholder="Digite o nome do restaurante">
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>CNPJ *</label>
          <input type="text" placeholder="00.000.000/0000-00">
        </div>
        <div class="form-group">
          <label>Categoria *</label>
          <select class="custom-select">
            <option value="" disabled selected>Selecione...</option>
            <option value="pizzaria">Pizzaria</option>
            <option value="hamburgueria">Hamburgueria</option>
            <option value="japonesa">Comida Japonesa</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Descrição *</label>
        <textarea rows="4" placeholder="Fale um pouco sobre as especialidades do restaurante..."></textarea>
      </div>

      <div class="form-group">
        <label>URL da Foto do Restaurante (opcional)</label>
        <input type="text" placeholder="https://exemplo.com/foto.jpg">
      </div>

      <div class="actions-wrapper">
        <button class="btn-secondary" (click)="previousStep()">Voltar</button>
        <button class="btn-primary" (click)="nextStep()">Próximo</button>
      </div>
    </div>

    <div *ngIf="currentStep === 3" class="step-content">
      <div class="step-title">
        <svg class="icon-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <h2>Endereço do Restaurante</h2>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>CEP *</label>
          <input type="text" placeholder="00000-000">
        </div>
        <div class="form-group">
          <label>Estado *</label>
          <input type="text" placeholder="SP">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Cidade *</label>
          <input type="text" placeholder="Digite a cidade">
        </div>
        <div class="form-group">
          <label>Bairro *</label>
          <input type="text" placeholder="Digite o bairro">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group-70">
          <label>Rua *</label>
          <input type="text" placeholder="Nome da rua/avenida">
        </div>
        <div class="form-group-30">
          <label>Número *</label>
          <input type="text" placeholder="Nº">
        </div>
      </div>

      <div class="form-group">
        <label>Complemento (opcional)</label>
        <input type="text" placeholder="Sala, andar, etc.">
      </div>

      <div class="actions-wrapper">
        <button class="btn-secondary" (click)="previousStep()">Voltar</button>
        <button class="btn-primary" (click)="finalizarCadastro()">Criar Restaurante ⚡</button>
      </div>
    </div>

  </div>
</div>
