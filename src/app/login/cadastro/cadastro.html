<div class="registration-container">
  
  <header class="registration-header">
    <button class="btn-back" (click)="previousStep()" *ngIf="currentStep > 1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <button class="btn-back" (click)="voltarParaTelaAnterior()" *ngIf="currentStep === 1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="header-texts">
      <h1>Cadastro de Cliente</h1>
      <p>Preencha seus dados para começar</p>
    </div>
  </header>

  <div class="stepper-wrapper">
    <div class="step-item" [ngClass]="{'active': currentStep >= 1}">
      <div class="step-circle">1</div>
    </div>
    <div class="step-line" [ngClass]="{'filled': currentStep >= 2}"></div>
    <div class="step-item" [ngClass]="{'active': currentStep >= 2}">
      <div class="step-circle">2</div>
    </div>
    <div class="step-line" [ngClass]="{'filled': currentStep >= 3}"></div>
    <div class="step-item" [ngClass]="{'active': currentStep >= 3}">
      <div class="step-circle">3</div>
    </div>
  </div>

  <div class="form-card">

    <div *ngIf="currentStep === 1" class="step-content">
      <div class="step-title">
        <svg class="icon-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <h2>Dados Pessoais</h2>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Nome *</label>
          <input type="text" placeholder="Digite seu nome" [(ngModel)]="formData.nome" name="nome">
        </div>
        <div class="form-group">
          <label>Sobrenome *</label>
          <input type="text" placeholder="Digite seu sobrenome" [(ngModel)]="formData.sobrenome" name="sobrenome">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>CPF *</label>
          <input type="text" placeholder="000.000.000-00" [value]="formData.cpf" (input)="onCPFInput($event)" name="cpf">
        </div>
        <div class="form-group">
          <label>Data de Nascimento *</label>
          <input type="text" placeholder="dd/mm/aaaa" [value]="formData.dataNascimento" (input)="onDataInput($event)" name="dataNascimento">
        </div>
      </div>

      <div class="form-group">
        <label>URL da Foto (opcional)</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          <input type="text" placeholder="https://exemplo.com/foto.jpg" [(ngModel)]="formData.fotoUrl" name="fotoUrl">
        </div>
      </div>

      <button class="btn-primary" (click)="nextStep()">Próximo</button>
    </div>

    <div *ngIf="currentStep === 2" class="step-content">
      <div class="step-title">
        <svg class="icon-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        <h2>Informações de Contato</h2>
      </div>

      <div class="form-group">
        <label>Email *</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="email" placeholder="seu-email@provedor.com" [(ngModel)]="formData.email" name="email">
        </div>
      </div>

      <div class="form-group">
        <label>Telefone *</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          <input type="text" placeholder="(00) 00000-0000" [value]="formData.telefone" (input)="onTelefoneInput($event)" name="telefone">
        </div>
      </div>

      <div class="form-group">
        <label>Senha *</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" placeholder="Digite sua senha" [(ngModel)]="formData.senha" name="senha">
        </div>
      </div>

      <div class="form-group">
        <label>Confirmar Senha *</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" placeholder="Confirme sua senha" [(ngModel)]="formData.confirmaSenha" name="confirmaSenha">
        </div>
      </div>

      <div *ngIf="errorMessage" style="color: #e74c3c; margin: 10px 0; font-size: 14px;">
        {{ errorMessage }}
      </div>

      <div class="actions-wrapper">
        <button class="btn-secondary" (click)="previousStep()">Voltar</button>
        <button class="btn-primary" (click)="nextStep()">Próximo</button>
      </div>
    </div>

    <div *ngIf="currentStep === 3" class="step-content">
      <div class="step-title">
        <svg class="icon-red" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <h2>Endereço</h2>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>CEP *</label>
          <input type="text" placeholder="00000-000" [value]="formData.cep" (input)="onCEPInput($event)" name="cep">
        </div>
        <div class="form-group">
          <label>Estado *</label>
          <input type="text" placeholder="SP" [(ngModel)]="formData.estado" name="estado">
        </div>
      </div>

      <div class="form-group">
        <label>Cidade *</label>
        <input type="text" placeholder="Digite sua cidade" [(ngModel)]="formData.cidade" name="cidade">
      </div>

      <div class="form-group">
        <label>Bairro *</label>
        <input type="text" placeholder="Digite seu bairro" [(ngModel)]="formData.bairro" name="bairro">
      </div>

      <div class="form-grid">
        <div class="form-group-70">
          <label>Rua *</label>
          <input type="text" placeholder="Nome da rua/avenida" [(ngModel)]="formData.rua" name="rua">
        </div>
        <div class="form-group-30">
          <label>Número *</label>
          <input type="text" placeholder="Nº" [(ngModel)]="formData.numero" name="numero">
        </div>
      </div>

      <div class="form-group">
        <label>Complemento (opcional)</label>
        <input type="text" placeholder="Apto, bloco, etc." [(ngModel)]="formData.complemento" name="complemento">
      </div>

      <div *ngIf="errorMessage" style="color: #e74c3c; margin: 10px 0; font-size: 14px;">
        {{ errorMessage }}
      </div>

      <div class="actions-wrapper">
        <button class="btn-secondary" (click)="previousStep()" [disabled]="isLoading">Voltar</button>
        <button class="btn-primary" (click)="finalizarCadastro()" [disabled]="isLoading">{{ isLoading ? 'Carregando...' : 'Finalizar Cadastro' }}</button>
      </div>
    </div>

  </div>
</div>
