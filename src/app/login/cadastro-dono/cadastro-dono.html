<div class="registration-container">
  
  <header class="registration-header">
    <button class="btn-back" (click)="voltarParaTelaAnterior()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="header-texts">
      <h1>Cadastro de Parceiro</h1>
      <p>Gerencie seu negócio no Flash Food</p>
    </div>
  </header>

  <div class="form-card">
    
    <div class="step-title">
      <svg class="icon-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <h2>Dados Pessoais</h2>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Nome do Proprietário *</label>
        <input type="text" placeholder="Digite seu nome" [(ngModel)]="formData.nomeProprietario" name="nomeProprietario">
      </div>
      <div class="form-group">
        <label>Sobrenome *</label>
        <input type="text" placeholder="Digite seu sobrenome" [(ngModel)]="formData.sobrenome" name="sobrenome">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>CPF *</label>
        <input type="text" placeholder="000.000.000-00" [value]="formData.cpf" (input)="onCPFInput($event)" name="cpf">
      </div>
      <div class="form-group">
        <label>CNPJ da Empresa *</label>
        <input type="text" placeholder="00.000.000/0001-00" [value]="formData.cnpjEmpresa" (input)="onCNPJInput($event)" name="cnpjEmpresa">
      </div>
    </div>

    <div class="step-title" style="margin-top: 30px;">
      <svg class="icon-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
      <h2>Informações de Contato</h2>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Email Corporativo *</label>
        <input type="email" placeholder="seu-email@empresa.com" [(ngModel)]="formData.emailCorporativo" name="emailCorporativo">
      </div>
      <div class="form-group">
        <label>Telefone Comercial *</label>
        <input type="text" placeholder="(00) 00000-0000" [value]="formData.telefoneComercial" (input)="onTelefoneInput($event)" name="telefoneComercial">
      </div>
    </div>
    
    <div class="step-title" style="margin-top: 30px;">
      <svg class="icon-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <h2>Segurança de Acesso</h2>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Senha de Acesso *</label>
        <input type="password" placeholder="Digite sua senha" [(ngModel)]="formData.senha" name="senha">
      </div>
      <div class="form-group">
        <label>Confirmar Senha *</label>
        <input type="password" placeholder="Confirme sua senha" [(ngModel)]="formData.confirmaSenha" name="confirmaSenha">
      </div>
    </div>

    <div *ngIf="errorMessage" style="color: #e74c3c; margin: 10px 0; font-size: 14px;">
      {{ errorMessage }}
    </div>

    <button class="btn-finish" (click)="finalizarCadastro()" [disabled]="isLoading">{{ isLoading ? 'Carregando...' : 'Finalizar Cadastro Corporativo' }}</button>
  </div>
</div>
