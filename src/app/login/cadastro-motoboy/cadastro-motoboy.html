<div class="registration-container">
  
  <header class="registration-header">
    <button class="btn-back" (click)="voltarParaTelaAnterior()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <div class="header-texts">
      <h1>Cadastro de Motoboy</h1>
      <p>Seja um entregador do Flash Food</p>
    </div>
  </header>

  <div class="form-card">
    
    <div class="step-title">
      <svg class="icon-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <h2>Dados Pessoais</h2>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Nome *</label>
        <input type="text" placeholder="Digite seu nome" [(ngModel)]="formData.nome" name="nome">
      </div>
      <div class="form-group">
        <label>Sobrenome *</label>
        <input type="text" placeholder="Digite seu sobrenome" [(ngModel)]="formData.sobrenome" name="sobrenome">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>CPF *</label>
        <input type="text" placeholder="000.000.000-00" [value]="formData.cpf" (input)="onCPFInput($event)" name="cpf">
      </div>
      <div class="form-group">
        <label>CNH *</label>
        <input type="text" placeholder="00000000000" [value]="formData.cnh" (input)="onCNHInput($event)" name="cnh">
      </div>
    </div>

    <div class="step-title" style="margin-top: 30px;">
      <svg class="icon-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><path d="M15 6a3.5 3.5 0 1 0-7 0"></path><path d="M12 17.5V14l-3-3 4-3 2 3h2"></path></svg>
      <h2>Dados do Veículo</h2>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Placa da Moto *</label>
        <input type="text" placeholder="ABC-1234" [value]="formData.placaMoto" (input)="onPlacaInput($event)" name="placaMoto">
      </div>
      <div class="form-group">
        <label>Modelo da Moto *</label>
        <input type="text" placeholder="Honda CG 160" [(ngModel)]="formData.modeloMoto" name="modeloMoto">
      </div>
    </div>

    <div class="step-title" style="margin-top: 30px;">
      <svg class="icon-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
      <h2>Informações de Contato</h2>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Email *</label>
        <input type="email" placeholder="seu-email@provedor.com" [(ngModel)]="formData.email" name="email">
      </div>
      <div class="form-group">
        <label>Telefone *</label>
        <input type="text" placeholder="(00) 00000-0000" [value]="formData.telefone" (input)="onTelefoneInput($event)" name="telefone">
      </div>
    </div>
    <div class="form-group">
      <label>URL da Foto (opcional)</label>
      <input type="text" placeholder="https://exemplo.com/foto.jpg" [(ngModel)]="formData.fotoUrl" name="fotoUrl">
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Senha *</label>
        <input type="password" placeholder="Digite sua senha" [(ngModel)]="formData.senha" name="senha">
      </div>
      <div class="form-group">
        <label>Confirmar Senha *</label>
        <input type="password" placeholder="Confirme sua senha" [(ngModel)]="formData.confirmaSenha" name="confirmaSenha">
      </div>
    </div>

    <div *ngIf="errorMessage" style="color: #e74c3c; margin: 10px 0; font-size: 14px;">
      {{ errorMessage }}
    </div>

    <button class="btn-finish" type="button" (click)="finalizarCadastro()" [disabled]="isLoading">{{ isLoading ? 'Carregando...' : 'Finalizar Cadastro' }}</button>
  </div>
</div>
